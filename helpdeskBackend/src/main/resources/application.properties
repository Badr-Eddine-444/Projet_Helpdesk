spring.application.name=helpdeskBackend
# Port du serveur de l'API
server.port=8080

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
# "update" permet a Spring de creer ou modifier les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
# Affiche les requetes SQL dans la console (pratique pour le debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuration Upload de fichiers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads
